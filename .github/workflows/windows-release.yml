name: Windows CLI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to attach the Windows package to
        required: true
        default: v1.0.0
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-windows-build.txt

      - name: Build standalone CLI
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name STOP-Djvu-Recovery --add-data "vendor;vendor" recover.py

      - name: Verify executable startup
        run: .\dist\STOP-Djvu-Recovery.exe --check

      - name: Run synthetic demo
        shell: pwsh
        run: .\demo\Run-Synthetic-Demo.ps1 -OutputRoot "$env:RUNNER_TEMP\kook-recovery-synthetic-demo" -ExePath ".\dist\STOP-Djvu-Recovery.exe"

      - name: Assemble release zip
        shell: pwsh
        run: |
          $package = "dist\STOP-Djvu-Recovery-Windows-x64"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "dist\STOP-Djvu-Recovery.exe" $package
          Copy-Item "WINDOWS-CLI.md" "$package\README.md"
          Copy-Item "LICENSE" $package
          Copy-Item "THIRD-PARTY-NOTICES.md" $package
          Copy-Item "demo" $package -Recurse
          Compress-Archive -Path "$package\*" -DestinationPath "dist\STOP-Djvu-Recovery-Windows-x64.zip" -Force

      - name: Upload Windows package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" "dist\STOP-Djvu-Recovery-Windows-x64.zip" --clobber
